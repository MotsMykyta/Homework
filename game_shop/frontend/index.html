<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>
  </head>
  <body>
    <div id="app"></div>
    
    <div id = "main-page"  class ="container">
      <h1>Game Store</h1>
      <div id = "games-container" class="games-grid"></div>
      <div id = "pagination-container" class="pagination"></div>
    </div>
    <div id="details-page" style="display: none;"></div>
    </div>
    <div id="edit-modal" class="modal-overlay" style="display: none;">
      <div class="modal-content">
        <h3>Edit Price</h3>
        <input type="number" id="edit-price-input" placeholder="Enter new price..." step="0.01" min="0" />
        <div class="modal-actions">
          <button id="btn-save-edit" class="btn-success">Save</button>
          <button id="btn-cancel-edit" class="btn-secondary">Cancel</button>
        </div>
      </div>
    </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
