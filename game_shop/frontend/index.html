<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>
  </head>
  <body>
    <div id="app">
      <!-- Главная страница -->
      <div id="main-page" class="container">
        <header class="page-header">
          <h1>Game Store</h1>
        </header>
        
        <div class="search-container">
          <input type="text" id="search-input" placeholder="Поиск игр...">
        </div>

        <div id="games-container" class="games-grid"></div>
        <div id="pagination-container" class="pagination"></div>
      </div>
      
      <!-- Страница деталей -->
      <div id="details-page" class="container" style="display: none;"></div>
      
      <!-- Модалка редактирования -->
      <div id="edit-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
          <h3>Edit Price</h3>
          <input type="number" id="edit-price-input" placeholder="Enter new price..." step="0.01" min="0" />
          <div class="modal-actions">
            <button id="btn-save-edit" class="btn-success">Save</button>
            <button id="btn-cancel-edit" class="btn-secondary">Cancel</button>
          </div>
        </div>
      </div>
      
      <!-- Модалка удаления -->
      <div id="delete-confirm-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
          <h3>Deletion confirmation</h3>
          <p>Are you sure you want to delete this game? This action is irreversible.</p>
          <div class="modal-actions">
            <button id="btn-confirm-delete" class="btn-danger">Delete</button>
            <button id="btn-cancel-delete" class="btn-secondary">Cancel</button>
          </div>
        </div>
      </div>
    </div>

    <div id="add-modal" class="modal-overlay" style="display: none;">
      <div class="modal-content">
        <h3>Add new game</h3>
        <input type="text" id="add-title" placeholder="Game title" />
        <input type="text" id="add-genre" placeholder="Genre" />
        <input type="number" id="add-price" placeholder="Price ($)" step="0.01" min="0" />
        <input type="number" id="add-year" placeholder="Release year" />
        <input type="text" id="add-platform" placeholder="Platforms (e.g., PC, PS5)" />
        <input type="text" id="add-cover" placeholder="Cover URL (optional)" />
        
        <div class="modal-actions">
          <button id="btn-save-add" class="btn-success">Create</button>
          <button id="btn-cancel-add" class="btn-secondary">Cancel</button>
        </div>
      </div>
    </div>
    
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
